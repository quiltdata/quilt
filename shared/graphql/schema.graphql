type Query {
  me: Me

  config: Config!
  bucketConfigs: [BucketConfig!]!
  bucketConfig(name: String!): BucketConfig
  buckets: [Bucket!]!
  bucket(name: String!): Bucket
  potentialCollaborators: [Collaborator!]!
  packages(bucket: String!, filter: String): PackageList
  package(bucket: String!, name: String!): Package
  searchObjects(
    buckets: [String!]
    searchString: String
    filter: ObjectsSearchFilter
  ): ObjectsSearchResult!
  searchPackages(
    buckets: [String!]
    searchString: String
    filter: PackagesSearchFilter
    userMetaFilters: [PackageUserMetaPredicate!]
    latestOnly: Boolean! = false
  ): PackagesSearchResult!
  searchMoreObjects(after: String!, size: Int = 30): ObjectsSearchMoreResult!
  searchMorePackages(after: String!, size: Int = 30): PackagesSearchMoreResult!
  subscription: SubscriptionState!

  bucketAccessCounts(bucket: String!, window: Int!): BucketAccessCounts
  objectAccessCounts(bucket: String!, key: String!, window: Int!): AccessCounts

  """
  Every product the caller can see, readable or not. Discovery and readability
  are different questions, and filtering unreadable products out here would hide
  the case a request affordance exists for.
  """
  dataProducts: [DataProduct!]!
  """
  One product, or null. Null is an ordinary answer: ids are synthesized from the
  binding and are not stable across renames.
  """
  dataProduct(id: ID!): DataProduct
  """
  Requests recorded against a product. Always answerable, because the record is
  Quilt's — an empty list is a real answer, not a failure to reach the platform.
  """
  dataProductRequests(dataProductId: ID!): [DataProductRequest!]!
  """Configured external catalogs. Admin-only: endpoints are infrastructure."""
  dataProductConnections: [DataProductConnection!]! @admin

  admin: AdminQueries! @admin

  policies: [Policy!]! @admin
  policy(id: ID!): Policy @admin
  roles: [Role!]! @admin
  role(id: ID!): Role @admin
  defaultRole: Role @admin
  status: StatusResult! @admin
}

