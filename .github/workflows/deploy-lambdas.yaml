name: Deploy lambdas to S3 and ECR

# `dev` builds Prod+GovCloud artifacts so the deployment `dev` branch can pin
# bleeding-edge SHAs onto https://dev.quilttest.com.
on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: Prepended to the zip key and image tag (e.g. "dev-" names them "dev-<sha>"). "none" names them just <sha>; an empty value falls back to "dev-". Ignored on dev, whose builds deployment pins by bare sha.
        type: string
        default: 'dev-'
  push:
    branches:
      - master
      - dev
    paths:
      - '.github/workflows/deploy-lambdas.yaml'
      - 'lambdas/**'

env:
  # Pushes (which have no inputs) and every run on dev publish under the bare sha
  # that deployment pins. "none" stands in for an empty prefix, which GitHub
  # replaces with the default.
  ARTIFACT_TAG: ${{ inputs.tag_prefix != 'none' && github.ref != 'refs/heads/dev' && inputs.tag_prefix || '' }}${{ github.sha }}

jobs:
  deploy-lambda-s3:
    strategy:
      fail-fast: false
      matrix:
        path:
          - access_counts
          - es_ingest
          - iceberg
          - pkgevents
          - pkgpush
          - preview
          - s3hash
          - s3tags
          - status_reports
          - manifest_indexer
          - transcode
    runs-on: ubuntu-latest
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build zip
        run: |
          BUILDER_IMAGE=amazon/aws-lambda-python:$(cat lambdas/${{ matrix.path }}/.python-version)

          touch ./out.zip

          docker run --rm \
            --entrypoint /build_zip.sh \
            -v "$PWD/lambdas/${{ matrix.path }}":/lambda/function:z \
            -v "$PWD/out.zip":/out.zip:z \
            -v "$PWD/lambdas/scripts/build_zip.sh":/build_zip.sh:z \
            "$BUILDER_IMAGE"
      - name: Configure AWS credentials from Prod account
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::730278974607:role/github/GitHub-Quilt
          aws-region: us-east-1
      - name: Upload zips to Prod S3
        run: |
          s3_key="${{ matrix.path }}/$ARTIFACT_TAG.zip"
          ./lambdas/scripts/upload_zip.sh ./out.zip "$AWS_REGION" "$s3_key"
      - name: Configure AWS credentials from GovCloud account
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws-us-gov:iam::313325871032:role/github/GitHub-Quilt
          aws-region: us-gov-east-1
      - name: Upload zips to GovCloud S3
        run: |
          s3_key="${{ matrix.path }}/$ARTIFACT_TAG.zip"
          ./lambdas/scripts/upload_zip.sh ./out.zip "$AWS_REGION" "$s3_key"

  deploy-lambda-ecr:
    strategy:
      fail-fast: false
      matrix:
        path:
          - indexer
          - thumbnail
          - tabular_preview
    runs-on: ubuntu-latest
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        working-directory: ./lambdas/${{ matrix.path }}
        run: docker buildx build -t "quiltdata/lambdas/${{ matrix.path }}:$ARTIFACT_TAG" -f Dockerfile .
      - name: Configure AWS credentials from Prod account
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::730278974607:role/github/GitHub-Quilt
          aws-region: us-east-1
      - name: Push Docker image to Prod ECR
        run: ./lambdas/scripts/upload_ecr.sh 730278974607 "quiltdata/lambdas/${{ matrix.path }}:$ARTIFACT_TAG"
      - name: Configure AWS credentials from GovCloud account
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws-us-gov:iam::313325871032:role/github/GitHub-Quilt
          aws-region: us-gov-east-1
      - name: Push Docker image to GovCloud ECR
        run: ./lambdas/scripts/upload_ecr.sh 313325871032 "quiltdata/lambdas/${{ matrix.path }}:$ARTIFACT_TAG"
