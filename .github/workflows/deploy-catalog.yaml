name: Deploy catalog to ECR

on:
  push:
    branches:
      - master
      # TEMP (meta-sort dev stack): build a dev-<sha> catalog image from this
      # feature branch. Revert before merge. See qhq-spls.1.
      - meta-sort
    paths:
      - '.github/workflows/deploy-catalog.yaml'
      - 'catalog/**'
      - 'shared/**'

jobs:
  deploy-catalog-ecr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'catalog/package.json'
          cache: 'npm'
          cache-dependency-path: 'catalog/package-lock.json'
      - run: npm ci
      - run: npm run build
      - name: Configure AWS credentials from Prod account
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::730278974607:role/github/GitHub-Quilt
          aws-region: us-east-1
      - name: Login to Prod ECR
        id: login-prod-ecr
        uses: aws-actions/amazon-ecr-login@v2
      # TEMP (meta-sort dev stack): prod ECR only. The dev stack pulls the
      # catalog image from prod ECR (730278974607/quiltdata/catalog); the
      # GovCloud/MP cross-account pushes are dropped to cut failure surface.
      # Tag is dev-<sha> to match the _VERSIONS pin convention. Revert before
      # merge. See qhq-spls.1.
      - name: Build and push Docker image to Prod ECR
        env:
          ECR_REGISTRY_PROD: ${{ steps.login-prod-ecr.outputs.registry }}
          ECR_REPOSITORY: quiltdata/catalog
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          docker buildx build \
            -t $ECR_REGISTRY_PROD/$ECR_REPOSITORY:$IMAGE_TAG \
            .
          docker push $ECR_REGISTRY_PROD/$ECR_REPOSITORY:$IMAGE_TAG
