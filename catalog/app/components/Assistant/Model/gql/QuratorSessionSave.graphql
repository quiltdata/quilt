mutation ($input: QuratorSessionSaveInput!) {
  quratorSessionSave(input: $input) {
    __typename
    ... on QuratorSession {
      id
      version
      package {
        revisedAt
      }
    }
    ... on InvalidInput {
      errors {
        name
        context
      }
    }
    ... on OperationError {
      name
    }
  }
}
