query (
  $buckets: [String!]
  $searchString: String
  $filter: PackagesSearchFilter
  $userMetaFilters: [PackageUserMetaPredicate!]
  $latestOnly: Boolean!
  $ordering: PackageOrdering
) {
  searchPackages(
    buckets: $buckets
    searchString: $searchString
    filter: $filter
    userMetaFilters: $userMetaFilters
    latestOnly: $latestOnly
  ) {
    __typename
    ... on PackagesSearchResultSet {
      total
      firstPage(ordering: $ordering) {
        __typename
        ... on PackagesSearchResultSetPage {
          cursor
          hits {
            __typename
            id

            bucket
            name
            pointer
            hash
            score

            size
            modified
            totalEntriesCount

            comment
            meta
            workflow

            matchLocations {
              comment
              meta
              name
              workflow
            }

            matchingEntries {
              logicalKey
              physicalKey
              size
              meta
              matchLocations {
                contents
                logicalKey
                meta
                physicalKey
              }
            }
          }
        }
        ... on InvalidInput {
          errors {
            path
            message
            name
            context
          }
        }
        ... on OperationError {
          name
          message
          context
        }
      }
    }
    ... on InvalidInput {
      errors {
        path
        message
        name
        context
      }
    }
    ... on OperationError {
      name
      message
      context
    }
  }
}
