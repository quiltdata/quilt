query ($id: ID!) {
  dataProduct(id: $id) {
    id
    name
    title
    description
    createdAt
    ownerRole {
      __typename
      ... on ManagedRole {
        id
        name
      }
      ... on UnmanagedRole {
        id
        name
      }
    }
    members {
      __typename
      # All-or-nothing: a caller who cannot read every resolved member gets this
      # instead of the membership, and it carries nothing to disclose.
      ... on SourceDenied {
        rejectionClass
      }
      ... on DataProductMembers {
        objects {
          logicalKey
          bucket
          key
          versionId
          # Where a predicate-selected object came from. Null for an object an
          # author enumerated by hand.
          source {
            bucket
            packageName
            hash
            logicalKey
          }
        }
        packages {
          virtualName
          bucket
          name
          hashOrTag
          # The revision the server resolved this member at, honouring its pin.
          # `package.revision` below cannot take the member's own pin (no
          # per-list-item arguments in GraphQL) and so is always latest.
          resolvedRevision {
            hash
            modified
            message
            totalEntries
            totalBytes
            userMeta
            workflow {
              id
            }
          }
          package {
            modified
            revisions {
              total
            }
          }
        }
      }
    }
  }
}
