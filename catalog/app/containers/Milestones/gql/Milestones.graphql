query {
  milestones {
    __typename
    ... on StackMilestones {
      packages
      largestPackageBytes
      largestPackageFiles
      totalPackagedBytes
      bucketsWithPackages
      mostRevisions
      activeUsers
      firstPackageAt
      firstMultiTerabyteAt
      firstWorkflowPackageAt
    }
    ... on OperationError {
      message
    }
  }
}
