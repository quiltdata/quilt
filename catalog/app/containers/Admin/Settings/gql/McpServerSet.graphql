mutation ($slug: ID!, $input: McpServerInput!) {
  admin {
    mcpServerSet(slug: $slug, input: $input) {
      __typename
      ... on McpServerAdmin {
        slug
        title
        url
        hint
        enabled
        trusted
        auth
        authHeader
        authPrefix
        hasSecret
        forwardIdentity
        updatedAt
        oauthClientId
        hasOauthClientSecret
        oauthRedirectUri
        signedInUsers
      }
      ... on InvalidInput {
        errors {
          path
          name
          message
        }
      }
      ... on OperationError {
        name
        message
      }
    }
  }
}
