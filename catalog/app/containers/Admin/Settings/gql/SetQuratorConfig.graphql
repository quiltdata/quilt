mutation ($input: QuratorConfigInput!) {
  admin {
    setQuratorConfig(input: $input) {
      __typename
      ... on QuratorConfig {
        models {
          allowlist
          default
          requestTimeoutSeconds
          maxToolCallsPerTurn
          sessionRetentionDays
          sessionMaxPerUser
          sessionsEnabled
          names {
            id
            name
          }
        }
        gateway {
          endpointUrl
          accountId
        }
      }
      ... on InvalidInput {
        errors {
          path
          message
        }
      }
      ... on OperationError {
        message
      }
    }
  }
}
