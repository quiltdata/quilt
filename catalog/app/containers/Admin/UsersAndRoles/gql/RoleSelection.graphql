fragment RoleSelection on Role {
  __typename
  ... on UnmanagedRole {
    id
    name
    arn
    defaultBucket
    signup {
      ...RoleSignupSelection
    }
  }
  ... on ManagedRole {
    id
    name
    arn
    permissions {
      bucket {
        name
      }
      level
    }
    policies {
      id
      title
      managed
      permissions {
        bucket {
          name
        }
        level
      }
      roles {
        id
      }
    }
    defaultBucket
    signup {
      ...RoleSignupSelection
    }
  }
}

fragment RoleSignupSelection on RoleSignup {
  page
  accessCode
  title
  description
}
