<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <title>Signing in</title>
  </head>
  <body>
    <p>Signing in. You can close this window and return to Quilt.</p>
    <script>
      // Hands the provider's answer to the Quilt tab that started the sign-in,
      // which matches it by `state`. Stores nothing. The answer is in the
      // fragment, which never reaches a server log; the query form is read only
      // while registries still redirect with it.
      ;(function () {
        var hash = window.location.hash.replace(/^#/, '')
        var q = new URLSearchParams(hash || window.location.search)
        var error = q.get('error')
        var msg = {
          type: 'quilt-mcp-oauth',
          ok: !error && !!q.get('code') && !!q.get('state'),
          code: q.get('code'),
          state: q.get('state'),
        }
        if (q.get('iss')) msg.iss = q.get('iss')
        if (error) msg.error = error
        try {
          var channel = new BroadcastChannel('quilt-mcp-oauth')
          channel.postMessage(msg)
          channel.close()
        } catch (e) {
          // No BroadcastChannel: the text above tells the user what to do.
        }
        history.replaceState(null, '', window.location.pathname)
        window.close()
      })()
    </script>
  </body>
</html>
