server {
    listen 80 default_server;
    listen [::]:80 default_server;

    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript;

    root /usr/share/nginx/html;

    error_page 404 /index.html;

    rewrite ^/oauth-callback$ /oauth-callback.html last;
    rewrite ^/oauth/mcp-callback$ /oauth-mcp-callback.html last;

    # Webpack emits assets at the web root. Anchored so app routes such as
    # /b/<bucket>/tree/<key>.png fall through to `location /`.
    location ~ ^/([^/]+\.(jpg|jpeg|gif|png|chunk\.js)|(app|runtime|main)\.[^/]+\.js)$ {
        expires 7776000;
    }

    # Its URL carries a one-time sign-in code: never cache it or send it on.
    location = /oauth-mcp-callback.html {
        add_header Cache-Control no-store;
        add_header Referrer-Policy no-referrer;
        add_header X-Frame-Options DENY;
    }

    location = /sw.js {
        expires -1;
    }

    location / {
        expires 600;
        add_header X-Frame-Options DENY;
        try_files $uri /index.html =404;
    }

    location = /healthcheck {
        add_header 'Content-Type' 'text/plain';
        return 200 'Nginx Catalog';
    }
}
