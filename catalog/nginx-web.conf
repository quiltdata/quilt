server {
    listen 80 default_server;
    listen [::]:80 default_server;

    charset utf-8;

    gzip on;
    # Long-cached `public` assets: shared caches must key on the encoding.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript;
    # Serve the level-9 `.gz` webpack's CompressionPlugin writes beside each
    # asset instead of re-gzipping it at nginx's default level on every request.
    gzip_static on;

    root /usr/share/nginx/html;

    error_page 404 /index.html;

    rewrite ^/oauth-callback$ /oauth-callback.html last;

    # Webpack emits assets at the web root. Anchored so app routes such as
    # /b/<bucket>/tree/<key>.png fall through to `location /`.
    location ~ ^/([^/]+\.(jpg|jpeg|gif|png|chunk\.js)|(app|runtime|main)\.[^/]+\.js)$ {
        expires 7776000;
    }

    location = /sw.js {
        expires -1;
    }

    location / {
        expires 600;
        add_header X-Frame-Options DENY;
        try_files $uri /index.html =404;
    }

    location = /healthcheck {
        add_header 'Content-Type' 'text/plain';
        return 200 'Nginx Catalog';
    }
}
