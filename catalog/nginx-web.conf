server {
    listen 80 default_server;
    listen [::]:80 default_server;

    charset utf-8;

    gzip on;
    # Long-cached `public` assets: shared caches must key on the encoding.
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript;

    root /usr/share/nginx/html;

    error_page 404 /index.html;

    rewrite ^/oauth-callback$ /oauth-callback.html last;

    # Webpack emits assets at the web root. Anchored so app routes such as
    # /b/<bucket>/tree/<key>.png fall through to `location /`. Only names carrying
    # webpack's contenthash are immutable; unhashed `config.js` must stay short.
    location ~ "^/([^/]+\.)?[0-9a-f]{16,}(\.chunk)?\.(js|woff2?|ttf|otf|eot|wasm|svg|png|jpe?g|gif|webp|webm|mp4)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed root images (e.g. quilt-og.png) can change in place.
    location ~ "^/[^/]+\.(jpg|jpeg|gif|png)$" {
        expires 7776000;
    }

    location = /sw.js {
        expires -1;
    }

    location / {
        expires 600;
        add_header X-Frame-Options DENY;
        try_files $uri /index.html =404;
    }

    location = /healthcheck {
        add_header 'Content-Type' 'text/plain';
        return 200 'Nginx Catalog';
    }
}
