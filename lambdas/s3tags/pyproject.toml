[project]
name = "t4_lambda_s3tags"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "boto3~=1.40",
    "pyyaml~=6.0",
]

[build-system]
requires = ["uv_build==0.9.*"]
build-backend = "uv_build"

[dependency-groups]
test = [
    "pytest~=9.1",
    "pytest-cov~=7.0",
    "pytest-env~=1.1",
    "pytest-mock~=3.15",
]

[tool.uv]
default-groups = ["test"]
